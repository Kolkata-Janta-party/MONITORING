name: Deploy MONITORING to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monitoring-pages
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate required files
        run: |
          set -e
          for f in index.html styles.css app.js manifest.webmanifest sw.js service.html service-detail.js privacy.html 404.html operator.html operator.js; do test -s "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          js=Path("app.js").read_text()
          assert 'href="styles.css"' in html
          assert 'src="app.js"' in html
          assert "server-side" in html.lower()
          assert "monitor-api-final" in js
          assert "setInterval(refresh,60000)" in js
          print("Static validation passed")
          PY
          node --check app.js
          node --check service-detail.js
          node --check operator.js
          python3 -m json.tool manifest.webmanifest >/dev/null
      - name: Browser smoke test
        run: |
          set -e
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.13.0 >/dev/null 2>&1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8080 >/tmp/monitoring-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node --input-type=module <<'JS'
          import { chromium, devices } from "playwright";
          import { AxeBuilder } from "@axe-core/playwright";
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors = [];
          const urls = ["/", "/operator.html", "/service.html?id=missing", "/privacy.html", "/404.html"];
          page.on("pageerror", e => errors.push(page.url()+" :: "+String(e.stack||e)));
          for (const path of urls) {
            const response = await page.goto("http://127.0.0.1:8080"+path, {waitUntil:"networkidle"});
            if (!response || !response.ok()) throw new Error("HTTP failure for "+path);
            if (path === "/" && !(await page.locator("h1").count())) throw new Error("Home heading missing");
            if (path === "/operator.html" && !(await page.locator("#loginForm").count())) throw new Error("Operator login missing");
            if (path.startsWith("/service.html") && !(await page.locator("#name").count())) throw new Error("Service detail missing");
            if (path === "/404.html" && !(await page.locator("h1").count())) throw new Error("404 heading missing");
            const axe = await new AxeBuilder({page}).withTags(["wcag2a","wcag2aa"]).analyze();
            const serious = axe.violations.filter(v => v.impact === "serious" || v.impact === "critical");
            if (serious.length) throw new Error("Accessibility violations on "+path+": "+JSON.stringify(serious));
            const links = await page.locator("a[href]").evaluateAll(as => as.map(a => a.href).filter(h => h.startsWith(location.origin)));
            for (const link of [...new Set(links)]) { const lr = await page.request.get(link); if (!lr.ok()) throw new Error("Broken link: "+link+" ("+lr.status()+")"); }
          }
          const mobile = await browser.newContext({...devices["Pixel 7"]});
          const mobilePage = await mobile.newPage();
          await mobilePage.goto("http://127.0.0.1:8080/", {waitUntil:"networkidle"});
          if (!(await mobilePage.locator("h1").count())) throw new Error("Mobile home heading missing");
          await mobilePage.goto("http://127.0.0.1:8080/operator.html", {waitUntil:"networkidle"});
          if (!(await mobilePage.locator("#loginForm").count())) throw new Error("Mobile operator login missing");
          await mobile.close();
          if (errors.length) throw new Error(errors.join("\n"));
          await browser.close();
          JS
      - name: Local HTTP checks
        run: |
          set -e
          python3 -m http.server 8080 >/tmp/monitoring-http-check.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/tmp/index.out
          curl --fail --silent --show-error http://127.0.0.1:8080/manifest.webmanifest >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/service.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/operator.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/privacy.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/404.html >/dev/null
          grep -q "SYSTEM OBSERVABILITY" /tmp/index.out

  deploy:
    needs: smoke-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  post-deploy-verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Browser verify production
        run: |
          set -e
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors = [];
          page.on("pageerror", e => errors.push(String(e)));
          for (const path of ["/MONITORING/","/MONITORING/operator.html","/MONITORING/service.html?id=530282b1-8af9-4896-8c17-e8bd1ceaf6c4","/MONITORING/privacy.html"]) {
            const response = await page.goto("https://kolkata-janta-party.github.io"+path, {waitUntil:"networkidle"});
            if (!response || !response.ok()) throw new Error("HTTP failure for "+path);
          }
          if (errors.length) throw new Error(errors.join("\n"));
          await browser.close();
          JS