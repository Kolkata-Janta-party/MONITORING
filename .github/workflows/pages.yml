name: Deploy MONITORING to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate required files
        run: |
          set -e
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.webmanifest
          test -s sw.js
          test -s service.html
          test -s privacy.html
          test -s 404.html
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          js=Path("app.js").read_text()
          assert 'href="styles.css"' in html
          assert 'src="app.js"' in html
          assert "function checkAll" in js
          assert "serviceWorker.register" in js
          print("Static validation passed")
          PY
      - name: Run local server
        run: |
          set -e
          python3 -m http.server 8080 >/tmp/monitoring-http.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/tmp/index.out
          curl --fail --silent --show-error http://127.0.0.1:8080/manifest.webmanifest >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/service.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/privacy.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/404.html >/dev/null
          grep -q "SYSTEM OBSERVABILITY" /tmp/index.out

  deploy:
    needs: smoke-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
